<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables edge-to-edge on notched/pill phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#FF6B81" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiwalibooth" />
    <meta name="description" content="Browser-based photobooth. No apps, no cloud, no accounts. Capture and save your own photobooth strips directly in your browser." />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/kiwalibooth.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>kiwalibooth — digital photobooth studio</title>

    <!-- Google Fonts: Fredoka (Headings & Important Texts) + Open Sans (Paragraphs & Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-black font-sans antialiased selection:bg-theme-soft selection:text-theme-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
